<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Gateway</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </div>
      <span class="brand-title">Download Gateway</span>
    </div>
    
    <div class="header-actions">
      <div id="statusBadge" class="status-badge disconnected" title="Disconnected">
        <span class="status-dot"></span>
        <span id="statusText">Offline</span>
      </div>
      <button id="optionsBtn" class="icon-btn" title="Extension Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1220a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"></path>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Speed Summary Bar -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-item">
      <span class="stat-label">DOWN</span>
      <span class="stat-value" id="downSpeed">0 KB/s</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-label">UP</span>
      <span class="stat-value" id="upSpeed">0 KB/s</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-label">ACTIVE</span>
      <span class="stat-value highlight" id="activeCount">0</span>
    </div>
  </div>

  <!-- Navigation Tabs -->
  <nav class="nav-tabs">
    <button class="nav-tab active" data-tab="addTab">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Add Task
    </button>
    <button class="nav-tab" data-tab="activityTab">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
      Activity <span id="activityBadge" class="tab-badge">0</span>
    </button>
  </nav>

  <main>
    <!-- TAB 1: Add Download -->
    <div id="addTab" class="tab-content active">
      <div class="form-group">
        <label for="urlInput">Download URL(s)</label>
        <div class="input-wrapper">
          <textarea id="urlInput" placeholder="Paste URL(s) here, one per line..." rows="3"></textarea>
          <button id="captureTabBtn" class="small-action-btn" title="Insert Current Tab URL">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            Current Tab
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="dirInput">Download Subfolder <span class="opt">(Optional)</span></label>
        <input type="text" id="dirInput" placeholder="e.g. Movies/2026 or Downloads">
      </div>

      <button id="downloadBtn" class="primary-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>Start Download</span>
      </button>

      <div id="messageArea" class="message-banner"></div>
    </div>

    <!-- TAB 2: Live Activity -->
    <div id="activityTab" class="tab-content">
      <div id="downloadsList" class="downloads-list">
        <div class="empty-state">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <p>No active downloads</p>
        </div>
      </div>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
