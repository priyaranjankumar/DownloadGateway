<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download Gateway Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Download Gateway Settings</h1>
    </header>

    <main>
      <div class="input-group">
        <label for="gatewayUrl">Gateway URL</label>
        <input type="text" id="gatewayUrl" placeholder="http://192.168.1.100:8000">
        <div class="help-text">The base URL of your Download Gateway server.</div>
      </div>

      <div class="input-group">
        <label for="apiToken">API Token</label>
        <div class="password-wrapper">
          <input type="password" id="apiToken" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
          <button type="button" id="toggleTokenBtn" class="icon-btn">Show</button>
        </div>
        <div class="help-text">Generate this token from your Download Gateway profile page.</div>
      </div>

      <div class="actions">
        <button id="testBtn" class="secondary-btn">Test Connection</button>
        <button id="saveBtn" class="primary-btn">Save Settings</button>
      </div>

      <div id="statusMessage"></div>
    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
